name: Update profile statistics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      ORG: BitHaven-Buffalo
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate stats SVG
        run: python3 scripts/update_stats.py
      - name: Commit changes
        run: |
          if git diff --quiet -- ./profile/assets/stats.svg; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/profile/assets/stats.svg
          git commit -m "chore: update profile stats"
          git push
